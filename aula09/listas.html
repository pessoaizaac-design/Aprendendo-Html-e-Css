<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        nav {
            background: rgba(0, 0, 0, 0.813);
            height: 50px;

            display: flex;
            align-items: center;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            font-family: Arial, Helvetica, sans-serif;

            padding: 10px;
            text-transform: uppercase;
        }
        nav a:hover {
            background: rgba(0, 0, 0, 0.3);
        }
        nav ul {
            display: flex;
            list-style: none;
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="#">Menu</a></li>
            <li><a href="#">Informações</a></li>
            <li><a href="#">Sobbre</a></li>
        </ul>
    </nav>

    <ul>
        <li>Item 1</li>
        <li>Item 1</li>
        <li>Item 1</li>
    </ul>
    <ol> <!-- Types = A, a, I and i -->
        <li>Item 1</li>
        <li>Item 1</li>
        <li>Item 1</li>
    </ol>
</body>
</html>
